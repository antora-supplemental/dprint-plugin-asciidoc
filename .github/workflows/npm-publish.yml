name: NPM Publish

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugin
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install current npm CLI
        run: npm install --global npm@11.19.1

      - name: Update package version
        working-directory: ./npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          pnpm version $VERSION --no-git-tag-version --allow-same-version

      - name: Copy WASM to npm package
        run: |
          cp target/wasm32-unknown-unknown/release/dprint_plugin_asciidoc.wasm npm/dprint_plugin_asciidoc.wasm

      - name: Check NPM registry
        id: npm
        working-directory: ./npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ESCAPED="${NAME//@/%40}"
          ESCAPED="${ESCAPED//\//%2F}"
          if curl --fail --silent --output /dev/null \
            "https://registry.npmjs.org/${ESCAPED}/${VERSION}"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: steps.npm.outputs.publish == 'true'
        working-directory: ./npm
        run: npm publish --access public

      - name: Create NPM package tarball
        working-directory: ./npm
        run: pnpm pack

      - name: Upload NPM tarball to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            npm/*.tgz
          append_body: true
          body: |

            ## NPM Package

            This release is also available on npm:
            ```bash
            npm install dprint-plugin-asciidoc
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}